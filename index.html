function optionsLabel(type) { return ({ RECEIVE_REGISTER: 'ทะเบียนหนังสือรับ', SEND_REGISTER: 'ทะเบียนหนังสือส่ง', PENDING: 'รายงานหนังสือรอดำเนินการ', OVERDUE: 'รายงานหนังสือเกินกำหนด', BY_TYPE: 'รายงานแยกตามประเภทหนังสือ', BY_STATUS: 'รายงานแยกตามสถานะ', MONTHLY: 'สถิติหนังสือรายเดือน' }[type] || type); }
async function downloadReportPdf() {
    const node = $('#reportPaper');
    if (!node || !LAST_REPORT)
        return;
    try {
        loading('กำลังจัดทำ PDF');
        const opt = { margin: [8, 8, 10, 8], filename: `${LAST_REPORT.type}_${new Date().toISOString().slice(0, 10)}.pdf`, image: { type: 'jpeg', quality: .98 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }, pagebreak: { mode: ['css', 'legacy'], avoid: 'tr' } };
        const blob = await html2pdf().set(opt).from(node).output('blob');
        if (blob.size > 8 * 1024 * 1024) {
            throw new Error('รายงาน PDF มีขนาดเกิน 8 MB กรุณาลดช่วงข้อมูลแล้วสร้างรายงานใหม่');
        }
        const base64 = await blobToBase64(blob);
        const stored = await api('pdf.storeGenerated', {
            fileName: opt.filename,
            fileBase64: base64,
            recordType: 'REPORT'
        });
        const encryptedFile = await api('attachments.download', { attachmentId: stored.AttachmentID });
        await api('reports.exportLog', { reportType: LAST_REPORT.type, format: 'PDF' });
        Swal.close();
        await deliverEncryptedDownload(encryptedFile);
    }
    catch (e) {
        Swal.close();
        Swal.fire({ icon: 'error', title: 'จัดทำ PDF ไม่สำเร็จ', text: e.message });
    }
}
function blobToBase64(blob) { return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result).split(',')[1]); r.onerror = reject; r.readAsDataURL(blob); }); }

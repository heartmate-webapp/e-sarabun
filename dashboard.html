<script>
'use strict';

/* ========================================================================== */
/* 01. CONSTANTS AND APPLICATION STATE                                         */
/* ========================================================================== */
const APP = {
  token: '', bootstrap: null, permissions: new Set(), selectedOrgId: '',
  lookups: {bookTypes:[],categories:[],urgencyLevels:[],secrecyLevels:[],departments:[],users:[],statuses:[]},
  activePage: 'dashboard', bookDirection: 'INCOMING', bookPage: 1, bookSearch: '', bookStatus: '',
  bookRows: [], bookTotal: 0, organizations: [], users: [], departments: [], roles: [],
  activeBook: null, activeBookDetail: null, activeDownloadPassword: '', activeDownloadId: '',
  notificationItems: [], reportItems: [], reportFilters: {}, settings: {}, permissionCatalog: [],
  busy: false, passwordChangeRequired: false
};
const PAGE_META = {
  dashboard: ['Dashboard','ภาพรวมการดำเนินงานสารบรรณ'],
  incoming: ['ทะเบียนหนังสือรับ','บันทึกและติดตามหนังสือรับของหน่วยงาน'],
  outgoing: ['ทะเบียนหนังสือส่ง','บันทึกและติดตามหนังสือส่งของหน่วยงาน'],
  workflow: ['เสนอหนังสือและสั่งการ','การมอบหมายงานและบันทึกข้อสั่งการ'],
  tracking: ['ติดตามสถานะหนังสือ','ค้นหาความคืบหน้าและประวัติการดำเนินการ'],
  organizations: ['จัดการหน่วยงาน','จัดการข้อมูลหน่วยงานในระบบส่วนกลาง'],
  users: ['จัดการผู้ใช้งาน','บัญชีผู้ใช้ บทบาท และคำขอรีเซ็ตรหัสผ่าน'],
  departments: ['จัดการฝ่าย / กอง','โครงสร้างหน่วยงานและผู้รับผิดชอบ'],
  settings: ['ตั้งค่าระบบ','ข้อมูลมาตรฐาน เลขทะเบียน และค่าการทำงาน'],
  reports: ['รายงานและสถิติ','รายงานทะเบียนรับ–ส่งตามเงื่อนไข'],
  audit: ['ประวัติการใช้งาน','ตรวจสอบเหตุการณ์และการเปลี่ยนแปลงข้อมูล'],
  notifications: ['การแจ้งเตือน','รายการแจ้งเตือนของบัญชีผู้ใช้']
};
const $ = (id) => document.getElementById(id);

/* ========================================================================== */
/* 02. GOOGLE APPS SCRIPT RPC AND RESPONSE HANDLING                            */
/* ========================================================================== */
function storedToken() {
  try { return localStorage.getItem('edoc_session_token') || sessionStorage.getItem('edoc_session_token') || ''; }
  catch (error) { return sessionStorage.getItem('edoc_session_token') || ''; }
}
function saveToken(token, remember) {
  try { localStorage.removeItem('edoc_session_token'); sessionStorage.removeItem('edoc_session_token'); } catch (error) {}
  try { (remember ? localStorage : sessionStorage).setItem('edoc_session_token', token); }
  catch (error) { sessionStorage.setItem('edoc_session_token', token); }
}
function clearToken() {
  try { localStorage.removeItem('edoc_session_token'); sessionStorage.removeItem('edoc_session_token'); } catch (error) {}
}
function rpc(functionName, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) {
      reject(new Error('ไม่พบการเชื่อมต่อ Google Apps Script กรุณาเปิดระบบผ่าน Web App URL'));
      return;
    }
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))));
    try { runner[functionName](...args); }
    catch (error) { reject(error); }
  });
}
async function api(functionName, ...args) {
  const response = await rpc(functionName, ...args);
  if (!response || response.ok !== true) {
    const error = response && response.error ? response.error : {};
    const message = error.message || 'ระบบไม่สามารถดำเนินการได้';
    if (['SESSION_INVALID','SESSION_EXPIRED','UNAUTHENTICATED','UNAUTHORIZED','USER_INACTIVE','ORG_INACTIVE','ROLE_INACTIVE'].includes(error.code)) {
      clearToken();
      window.location.href = '?page=index';
    }
    throw new Error(message);
  }
  return response.data;
}
function withOrg(filters = {}) {
  const result = Object.assign({}, filters);
  if (APP.selectedOrgId) result.org_id = APP.selectedOrgId;
  return result;
}
function orgForWrite() {
  if (APP.bootstrap && APP.bootstrap.isSuperAdmin && !APP.selectedOrgId) {
    throw new Error('กรุณาเลือกหน่วยงานจากตัวเลือกด้านบนก่อนเพิ่มหรือแก้ไขข้อมูลของหน่วยงาน');
  }
  return APP.selectedOrgId || (APP.bootstrap && APP.bootstrap.organization && APP.bootstrap.organization.org_id) || '';
}
function hasPermission(code) {
  return !!(APP.bootstrap && APP.bootstrap.isSuperAdmin) || APP.permissions.has(code);
}
function canAny(codes) { return codes.some(hasPermission); }

/* ========================================================================== */
/* 03. COMMON DISPLAY HELPERS                                                  */
/* ========================================================================== */
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function fmtDate(value) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return esc(value);
  return new Intl.DateTimeFormat('th-TH',{day:'2-digit',month:'short',year:'numeric'}).format(date);
}
function fmtDateTime(value) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return esc(value);
  return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(date);
}
function fmtNumber(value) { return new Intl.NumberFormat('th-TH').format(Number(value || 0)); }
function todayISO() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}
function dateValue(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value).slice(0,10);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function toast(message, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  $('toastBox').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function showError(error) { toast(error && error.message ? error.message : String(error), 'error'); }
function statusClass(status) {
  if (status === 'ดำเนินการแล้ว' || status === 'ACTIVE') return 'success';
  if (status === 'เกินกำหนด' || status === 'SUSPENDED' || status === 'ยกเลิก') return 'danger';
  if (status === 'ดำเนินการ' || status === 'รอตอบกลับ') return 'info';
  return 'warning';
}
function statusBadge(status) { return `<span class="badge ${statusClass(status)}">${esc(status || 'ไม่ระบุ')}</span>`; }
function emptyState(title = 'ไม่พบข้อมูล', description = 'ลองปรับเงื่อนไขการค้นหาแล้วลองอีกครั้ง') {
  return `<div class="empty-state"><div class="empty-icon">▤</div><strong>${esc(title)}</strong><p>${esc(description)}</p></div>`;
}
function loadingMarkup() { return '<div class="loading"><span class="spinner"></span> กำลังโหลดข้อมูล</div>'; }
function setContent(html) { $('content').innerHTML = html; }
function pageHeaderActions(html = '') { return `<div class="page-actions">${html}</div>`; }
function button(label, action, variant = 'primary', icon = '') {
  return `<button type="button" class="btn ${variant}" data-action="${esc(action)}">${icon ? `<span>${icon}</span>` : ''}${esc(label)}</button>`;
}
function optionList(rows, valueKey, labelKey, selected = '', placeholder = '— เลือกรายการ —') {
  return `<option value="">${esc(placeholder)}</option>` + (rows || []).map(row =>
    `<option value="${esc(row[valueKey])}" ${String(row[valueKey]) === String(selected || '') ? 'selected' : ''}>${esc(row[labelKey])}</option>`).join('');
}
function field(label, name, value = '', type = 'text', options = null, extra = {}) {
  const required = extra.required ? 'required' : '';
  const hint = extra.hint ? `<small class="field-hint">${esc(extra.hint)}</small>` : '';
  const cls = extra.full ? 'field full' : 'field';
  let control = '';
  if (type === 'select') control = `<select name="${esc(name)}" ${required}>${options || ''}</select>`;
  else if (type === 'textarea') control = `<textarea name="${esc(name)}" rows="${extra.rows || 3}" ${required}>${esc(value)}</textarea>`;
  else control = `<input type="${esc(type)}" name="${esc(name)}" value="${esc(value)}" ${required} ${extra.step ? `step="${esc(extra.step)}"` : ''} ${extra.min ? `min="${esc(extra.min)}"` : ''} placeholder="${esc(extra.placeholder || '')}">`;
  return `<div class="${cls}"><label>${esc(label)}${extra.required ? ' <b class="required">*</b>' : ''}</label>${control}${hint}</div>`;
}
function modal(title, body, footer) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = body;
  $('modalFooter').innerHTML = footer || `<button type="button" class="btn secondary" data-action="close-modal">ปิด</button>`;
  $('modalBackdrop').classList.add('visible');
}
function closeModal() {
  if (APP.passwordChangeRequired) return;
  $('modalBackdrop').classList.remove('open','visible');
  APP.activeDownloadPassword = '';
  APP.activeDownloadId = '';
  $('modalBody').innerHTML = '';
  $('modalFooter').innerHTML = '';
}
function formDataObject(form) {
  const data = {};
  new FormData(form).forEach((value, key) => { data[key] = String(value).trim(); });
  return data;
}
function requireWriteOrg() { return orgForWrite(); }
function selectedName(rows, id, idKey, labelKey) {
  const row = (rows || []).find(item => String(item[idKey]) === String(id));
  return row ? row[labelKey] : '';
}

/* ========================================================================== */
/* 04. APPLICATION INITIALIZATION AND GLOBAL LAYOUT                            */
/* ========================================================================== */
async function initializeDashboard() {
  APP.token = storedToken();
  if (!APP.token) { window.location.href = '?page=index'; return; }
  try {
    const data = await api('apiGetAppBootstrap', APP.token);
    APP.bootstrap = data;
    APP.permissions = new Set(data.permissions || []);
    APP.selectedOrgId = data.isSuperAdmin ? '' : (data.organization && data.organization.org_id || '');
    renderIdentity();
    renderNavigation();
    await loadLookups();
    if (data.isSuperAdmin) await loadOrganizationsForSwitcher();
    await loadNotificationCount();
    if (data.user && data.user.must_change_password) {
      openChangePasswordModal(true);
      return;
    }
    await navigate('dashboard');
  } catch (error) {
    clearToken();
    showError(error);
    setTimeout(() => { window.location.href = '?page=index'; }, 1400);
  }
}
function renderIdentity() {
  const org = APP.bootstrap.organization || {};
  const user = APP.bootstrap.user || {};
  const role = APP.bootstrap.role || {};
  $('sideOrgName').textContent = org.org_short_name || org.org_name || 'ระบบส่วนกลาง';
  $('sideOrgCode').textContent = org.org_code || '';
  $('sideOrgLogo').innerHTML = org.logo_url ? `<img src="${esc(org.logo_url)}" alt="โลโก้หน่วยงาน">` : esc((org.org_name || 'ส').slice(0,1));
  $('sideUserName').textContent = user.full_name || user.username || 'ผู้ใช้งาน';
  $('sideUserRole').textContent = role.role_name || role.role_code || '';
  $('sideAvatar').textContent = (user.full_name || user.username || 'ผ').slice(0,1);
  if (APP.bootstrap.isSuperAdmin) $('orgSwitcher').classList.remove('hidden');
}
function renderNavigation() {
  const menus = APP.bootstrap.menus || [];
  const menuIcons = {dashboard:'▦',incoming:'↓',outgoing:'↑',workflow:'⇢',tracking:'◎',organizations:'▤',users:'♙',departments:'⌂',settings:'⚙',reports:'▥',audit:'◷'};
  const aliases = {organizations:'organizations',users:'users',departments:'departments',settings:'settings',reports:'reports',audit:'audit'};
  const nav = menus.map(item => {
    const key = aliases[item.key] || item.key;
    return `<button type="button" class="nav-item" data-page="${esc(key)}"><span class="nav-icon">${menuIcons[item.key] || '•'}</span><span>${esc(item.label)}</span></button>`;
  }).join('');
  $('sidebarNav').innerHTML = nav || '<div class="empty-nav">ไม่มีเมนูตามสิทธิ์ที่ได้รับ</div>';
}
async function loadLookups() {
  try { APP.lookups = await api('apiGetLookups', APP.token, APP.selectedOrgId || null); }
  catch (error) { APP.lookups = {bookTypes:[],categories:[],urgencyLevels:[],secrecyLevels:[],departments:[],users:[],statuses:[]}; }
}
async function loadOrganizationsForSwitcher() {
  if (!APP.bootstrap.isSuperAdmin) return;
  try {
    const result = await api('apiListOrganizations', APP.token, {});
    APP.organizations = result.items || [];
    $('orgSwitcher').innerHTML = '<option value="">ภาพรวมทุกหน่วยงาน</option>' + APP.organizations.map(org =>
      `<option value="${esc(org.org_id)}">${esc(org.org_name)} (${esc(org.org_code)})</option>`).join('');
    $('orgSwitcher').value = APP.selectedOrgId;
  } catch (error) { showError(error); }
}
async function loadNotificationCount() {
  try {
    const data = await api('apiListNotifications', APP.token, {unreadOnly:true,limit:1});
    $('notificationDot').classList.toggle('hidden', !data.total);
  } catch (error) { $('notificationDot').classList.add('hidden'); }
}
async function navigate(page) {
  if (!PAGE_META[page]) page = 'dashboard';
  APP.activePage = page;
  const meta = PAGE_META[page];
  $('pageTitle').textContent = meta[0];
  $('pageSubtitle').textContent = meta[1];
  document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.page === page));
  $('sidebar').classList.remove('mobile-open');
  setContent(loadingMarkup());
  try {
    switch (page) {
      case 'dashboard': await renderDashboard(); break;
      case 'incoming': await renderBookRegister('INCOMING'); break;
      case 'outgoing': await renderBookRegister('OUTGOING'); break;
      case 'tracking': await renderTracking(); break;
      case 'workflow': await renderWorkflow(); break;
      case 'organizations': await renderOrganizations(); break;
      case 'users': await renderUsers(); break;
      case 'departments': await renderDepartments(); break;
      case 'settings': await renderSettings(); break;
      case 'reports': await renderReports(); break;
      case 'audit': await renderAudit(); break;
      case 'notifications': await renderNotifications(); break;
      default: await renderDashboard();
    }
  } catch (error) { setContent(emptyState('เกิดข้อผิดพลาด', error.message)); showError(error); }
}

/* ========================================================================== */
/* 05. DASHBOARD OVERVIEW                                                       */
/* ========================================================================== */
async function renderDashboard() {
  const filters = APP.selectedOrgId ? {org_id:APP.selectedOrgId} : {};
  const data = await api('apiGetDashboardSummary', APP.token, filters);
  const scope = APP.selectedOrgId ? (selectedName(APP.organizations, APP.selectedOrgId, 'org_id', 'org_name') || (APP.bootstrap.organization && APP.bootstrap.organization.org_name) || 'หน่วยงานของฉัน') : 'ทุกหน่วยงาน';
  const stats = [
    ['หนังสือรับทั้งหมด',data.incomingCount,'↓','primary'],
    ['หนังสือส่งทั้งหมด',data.outgoingCount,'↑','secondary'],
    ['อยู่ระหว่างดำเนินการ',data.pendingCount,'◷','warning'],
    ['เกินกำหนด',data.overdueCount,'!','danger']
  ];
  const cards = stats.map((item,index) => `<div class="stat-card"><div class="stat-top"><span>${item[0]}</span><span class="stat-icon ${item[3]}">${item[2]}</span></div><div class="stat-value">${fmtNumber(item[1])}</div><div class="stat-foot">${index===0?'รายการรับ':index===1?'รายการส่ง':index===2?'รายการที่ยังไม่ปิดงาน':'รายการที่พ้นกำหนด'}</div></div>`).join('');
  const byStatus = data.byStatus || {};
  const statusRows = Object.keys(byStatus).sort((a,b)=>Number(byStatus[b])-Number(byStatus[a])).map(status => `<div class="status-line"><span>${statusBadge(status)}</span><strong>${fmtNumber(byStatus[status])}</strong></div>`).join('');
  const recent = (data.recentIncoming || []).slice(0,6).map(row => `<tr><td>${esc(row.registration_no || '—')}</td><td>${esc(row.subject || '—')}</td><td>${fmtDate(row.receive_date)}</td><td>${statusBadge(row.status)}</td><td><button class="btn small secondary" data-action="open-book" data-direction="INCOMING" data-id="${esc(row.incoming_id)}">เปิด</button></td></tr>`).join('');
  setContent(`<div class="content-toolbar"><div><span class="eyebrow">ภาพรวม • ${esc(scope)}</span><h2 class="section-title">สรุปสถานะงานสารบรรณ</h2><p class="muted">อัปเดตจากข้อมูลทะเบียนในระบบ</p></div>${pageHeaderActions(button('รีเฟรช','refresh-page','secondary','↻'))}</div><div class="stat-grid">${cards}<div class="stat-card"><div class="stat-top"><span>แจ้งเตือนยังไม่อ่าน</span><span class="stat-icon info">♧</span></div><div class="stat-value">${fmtNumber(data.unreadNotificationCount)}</div><div class="stat-foot">รายการแจ้งเตือน</div></div>${APP.bootstrap.isSuperAdmin?`<div class="stat-card"><div class="stat-top"><span>หน่วยงานที่เปิดใช้งาน</span><span class="stat-icon secondary">▤</span></div><div class="stat-value">${fmtNumber(data.organizationCount)}</div><div class="stat-foot">หน่วยงาน</div></div>`:''}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h3>หนังสือรับล่าสุด</h3><p>รายการที่บันทึกในระบบล่าสุด</p></div>${button('ดูทะเบียนรับ','go-incoming','link')}</div><div class="table-wrap"><table><thead><tr><th>เลขทะเบียน</th><th>เรื่อง</th><th>วันที่รับ</th><th>สถานะ</th><th></th></tr></thead><tbody>${recent || ''}</tbody></table>${recent ? '' : emptyState('ยังไม่มีหนังสือรับ','เมื่อบันทึกหนังสือรับ รายการจะแสดงในส่วนนี้')}</div></section><section class="panel"><div class="panel-head"><div><h3>ภาพรวมตามสถานะ</h3><p>รวมทะเบียนรับและทะเบียนส่ง</p></div></div><div class="status-list">${statusRows || emptyState('ไม่มีข้อมูลสถานะ')}</div></section></div>`);
}

/* ========================================================================== */
/* 06. INCOMING AND OUTGOING REGISTERS                                          */
/* ========================================================================== */
async function renderBookRegister(direction) {
  APP.bookDirection = direction;
  const outgoing = direction === 'OUTGOING';
  const permission = outgoing ? 'books.outgoing.create' : 'books.incoming.create';
  const result = await api('apiListBooks', APP.token, direction, withOrg({
    search:APP.bookSearch,status:APP.bookStatus,page:APP.bookPage,pageSize:15
  }));

async function uploadAttachment() {
  const file = $('attachmentFile').files[0];
  if (!file) throw new Error('กรุณาเลือกไฟล์');
  if (file.size > 6*1024*1024) throw new Error('ไฟล์มีขนาดเกิน 6 MB');
  const base64 = await new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
  await api('apiUploadPrivateFile',APP.token,{
    book_direction:APP.activeBook.direction,book_id:APP.activeBook.id,
    fileName:file.name,mimeType:file.type || 'application/octet-stream',base64Data:base64,
    fileCategory:$('uploadForm').elements.fileCategory.value,
    isPrimary:$('uploadForm').elements.isPrimary.checked
  });
  toast('อัปโหลดไฟล์เรียบร้อยแล้ว');
  await openBookDetail(APP.activeBook.direction,APP.activeBook.id);
}

  const prepared = await api('apiPreparePasswordProtectedDownload',APP.token,attachmentId,navigator.userAgent);
  APP.activeDownloadPassword = prepared.password || '';

  const body = `<div class="download-success"><div class="success-mark">✓</div><h3>เตรียมไฟล์ดาวน์โหลดแล้ว</h3><p>${esc(prepared.fileName || 'ไฟล์เอกสาร')}</p></div><div class="password-display"><label>รหัสผ่านสำหรับเปิดไฟล์ ZIP</label><div class="password-row"><input type="password" id="downloadPasswordMasked" value="${esc(prepared.maskedPassword || '**********')}" readonly><button class="btn secondary" type="button" data-action="copy-download-password" title="คัดลอกรหัสผ่าน">▣ คัดลอก</button></div><small>ระบบไม่แสดงรหัสผ่านจริงบนหน้าจอ กรุณาคัดลอกรหัสผ่านเก็บไว้ก่อนปิดหน้าต่าง</small></div><div class="security-note">ไฟล์นี้ถูกเข้ารหัสด้วย AES-256 และลิงก์ดาวน์โหลดมีอายุจำกัด หลังดาวน์โหลดให้นำรหัสผ่านนี้ไปกรอกเพื่อแตกไฟล์ ZIP</div>`;
  modal('ดาวน์โหลดไฟล์ที่มีรหัสผ่าน',body,`<button class="btn secondary" data-action="close-download-modal">ปิด</button><a class="btn primary" id="protectedDownloadLink" href="${esc(prepared.downloadUrl)}" target="_blank" rel="noopener">ดาวน์โหลดไฟล์ ZIP</a>`);
  $('protectedDownloadLink').addEventListener('click',()=>{
    const downloadId = APP.activeDownloadId;
    if (downloadId) api('apiConfirmFileDownload',APP.token,downloadId).catch(showError);
  });
}

function csvCell(value) {
  let text=String(value==null?'':value);
  if (/^[=+\-@]/.test(text)) text="'"+text;

}
function downloadBlob(blob,filename) {
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a'); link.href=url; link.download=filename; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

  const body=`<form id="changePasswordForm" class="form-grid"><div class="full ${required?'alert warning':'note'}">${required?'บัญชีนี้ต้องเปลี่ยนรหัสผ่านก่อนเริ่มใช้งานระบบ':'เพื่อความปลอดภัย กรุณาตั้งรหัสผ่านที่คาดเดาได้ยาก'}</div>${field('รหัสผ่านปัจจุบัน','currentPassword','','password',null,{required:true})}${field('รหัสผ่านใหม่','newPassword','','password',null,{required:true,hint:'อย่างน้อย 12 ตัวอักษร'})}${field('ยืนยันรหัสผ่านใหม่','confirmPassword','','password',null,{required:true})}</form>`;
  modal('เปลี่ยนรหัสผ่าน',body,`<button class="btn secondary" data-action="close-modal" ${required?'disabled':''}>ยกเลิก</button><button class="btn primary" data-action="save-change-password">บันทึกรหัสผ่านใหม่</button>`);
  $('modalBackdrop').classList.add('visible');
}
async function saveChangePassword() {
  const form=$('changePasswordForm');if(!form.reportValidity())return;
  const payload=formDataObject(form);
  if(payload.newPassword.length<12)throw new Error('รหัสผ่านใหม่ต้องมีอย่างน้อย 12 ตัวอักษร');
  if(payload.newPassword!==payload.confirmPassword)throw new Error('รหัสผ่านใหม่และการยืนยันไม่ตรงกัน');
  await api('apiChangePassword',APP.token,{currentPassword:payload.currentPassword,newPassword:payload.newPassword});
  APP.passwordChangeRequired = false; $('modalClose').disabled = false;
  closeModal();toast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');
  const data=await api('apiGetAppBootstrap',APP.token);APP.bootstrap=data;APP.permissions=new Set(data.permissions||[]);
  await navigate('dashboard');
}
async function logout() {
  APP.passwordChangeRequired = false;
  try { await api('apiLogout',APP.token); } catch(error) {}
  clearToken();window.location.href='?page=index';
}

/* ========================================================================== */
/* 16. GLOBAL EVENT DELEGATION                                                 */
/* ========================================================================== */
async function handleAction(action,element) {
  const id=element.dataset.id || '';
  switch(action) {
    case 'close-modal': closeModal(); break;
    case 'close-download-modal': closeDownloadModal(); break;
    case 'clear-temporary-password': APP.activeDownloadPassword='';closeModal();break;
    case 'refresh-page': await navigate(APP.activePage);break;
    case 'go-incoming': await navigate('incoming');break;
    case 'go-outgoing': await navigate('outgoing');break;
    case 'new-book': openBookForm(APP.bookDirection,{});break;
    case 'save-book': await saveBookForm();break;
    case 'open-book': await openBookDetail(element.dataset.direction,element.dataset.id);break;
    case 'edit-current-book': {
      const detail=APP.activeBookDetail;const direction=APP.activeBook.direction;closeModal();openBookForm(direction,detail.book);break;
    }
    case 'assign-book': openAssignForm();break;
    case 'save-assignment': await saveAssignment();break;
    case 'complete-assignment': openCompleteAssignmentForm(id);break;
    case 'save-complete-assignment': await saveCompleteAssignment();break;
    case 'add-book-action': openBookActionForm();break;
    case 'save-book-action': await saveBookAction();break;
    case 'upload-file': openUploadForm();break;
    case 'save-upload': await uploadAttachment();break;
    case 'download-file': await downloadAttachment(element.dataset.attachment);break;
    case 'copy-download-password': await copyPasswordToClipboard();break;
    case 'book-page-prev': APP.bookPage=Math.max(1,APP.bookPage-1);await renderBookRegister(APP.bookDirection);break;
    case 'book-page-next': APP.bookPage+=1;await renderBookRegister(APP.bookDirection);break;
    case 'clear-book-filter': APP.bookSearch='';APP.bookStatus='';APP.bookPage=1;await renderBookRegister(APP.bookDirection);break;
    case 'new-organization': openOrganizationForm();break;
    case 'edit-organization': openOrganizationForm(APP.organizations.find(row=>row.org_id===id)||{});break;
    case 'save-organization': await saveOrganization();break;
    case 'toggle-organization': await setOrganizationStatus(id,element.dataset.status);break;
    case 'new-user': await loadUserRelatedData();openUserForm();break;
    case 'edit-user': {
      let targetUser=APP.users.find(row=>row.user_id===id);
      if(targetUser && APP.bootstrap.isSuperAdmin && targetUser.org_id && APP.selectedOrgId!==targetUser.org_id) {
        APP.selectedOrgId=targetUser.org_id; $('orgSwitcher').value=APP.selectedOrgId; await loadLookups();
      }
      await loadUserRelatedData(); targetUser=APP.users.find(row=>row.user_id===id)||targetUser||{}; openUserForm(targetUser); break;
    }
    case 'save-user': await saveUser();break;
    case 'reset-user-password': await resetUserPassword(id);break;
    case 'resolve-reset': await resolveResetRequest(id);break;
    case 'save-reset-decision': await saveResetDecision();break;
    case 'new-department': await loadUserRelatedData();openDepartmentForm();break;
    case 'edit-department': {
      let targetDepartment=APP.departments.find(row=>row.department_id===id);
      if(targetDepartment && APP.bootstrap.isSuperAdmin && targetDepartment.org_id && APP.selectedOrgId!==targetDepartment.org_id) {
        APP.selectedOrgId=targetDepartment.org_id; $('orgSwitcher').value=APP.selectedOrgId; await loadLookups();
      }
      await loadUserRelatedData(); targetDepartment=APP.departments.find(row=>row.department_id===id)||targetDepartment||{}; openDepartmentForm(targetDepartment); break;
    }
    case 'save-department': await saveDepartment();break;
    case 'settings-tab': renderSettingsTab(element.dataset.tab);break;
    case 'save-settings': await saveSettings();break;
    case 'new-lookup': openLookupForm(APP.activeSettingsTab||'categories');break;
    case 'edit-lookup': {
      const tab=element.dataset.tab;const idKey={bookTypes:'book_type_id',categories:'category_id',urgencyLevels:'urgency_id',secrecyLevels:'secrecy_id'}[tab];
      openLookupForm(tab,(APP.lookups[tab]||[]).find(row=>row[idKey]===id)||{});break;
    }
    case 'save-lookup': await saveLookup(element.dataset.tab);break;
    case 'new-role': openRoleForm();break;
    case 'edit-role': openRoleForm(APP.roles.find(row=>row.role_id===id)||{});break;
    case 'save-role': await saveRole();break;
    case 'role-permissions': await openRolePermissions(id);break;
    case 'save-role-permissions': await saveRolePermissions(id);break;
    case 'mark-notification': await markNotification(id,false);break;
    case 'mark-all-notifications': await markNotification('',true);break;
    case 'print-report': printReport();break;
    case 'export-report': await exportReport();break;
    case 'save-change-password': await saveChangePassword();break;
    default: break;
  }
}
async function copyPasswordToClipboard() {
  const password=APP.activeDownloadPassword;
  if(!password)throw new Error('ไม่พบรหัสผ่านสำหรับคัดลอก');
  if(navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(password);
  else {
    const area=document.createElement('textarea');area.value=password;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
    const copied=document.execCommand('copy');area.remove();if(!copied)throw new Error('ไม่สามารถคัดลอกรหัสผ่านได้');
  }
  toast('คัดลอกรหัสผ่านแล้ว');
}
function bindGlobalEvents() {
  document.addEventListener('click',async event=>{
    const pageTarget=event.target.closest('[data-page]');
    if(pageTarget){event.preventDefault();try{await navigate(pageTarget.dataset.page);}catch(error){showError(error);}return;}
    const target=event.target.closest('[data-action]');
    if(target){event.preventDefault();try{await handleAction(target.dataset.action,target);}catch(error){showError(error);}return;}
  });
  document.addEventListener('submit',async event=>{
    const form=event.target;
    if(form.id==='bookSearchForm') {
      event.preventDefault();const data=formDataObject(form);APP.bookSearch=data.search||'';APP.bookStatus=data.status||'';APP.bookPage=1;
      try{await renderBookRegister(APP.bookDirection);}catch(error){showError(error);}
    } else if(form.id==='reportForm') {
      event.preventDefault();try{await createReport(form);}catch(error){showError(error);}
    }
  });
  $('orgSwitcher').addEventListener('change',async event=>{
    APP.selectedOrgId=event.target.value;
    const activeOrg=APP.organizations.find(org=>org.org_id===APP.selectedOrgId);
    $('sideOrgName').textContent=activeOrg?(activeOrg.org_short_name||activeOrg.org_name):'ระบบส่วนกลาง';
    $('sideOrgCode').textContent=activeOrg?activeOrg.org_code:'';
    $('sideOrgLogo').innerHTML=activeOrg&&activeOrg.logo_url?`<img src="${esc(activeOrg.logo_url)}" alt="โลโก้หน่วยงาน">`:esc(activeOrg?(activeOrg.org_name||'ส').slice(0,1):'ส');
    try { await loadLookups();await navigate(APP.activePage); }
    catch(error){showError(error);}
  });
  $('logoutButton').addEventListener('click',logout);
  $('passwordButton').addEventListener('click',()=>openChangePasswordModal(false));
  $('notificationsButton').addEventListener('click',async()=>{try{await navigate('notifications');}catch(error){showError(error);}});
  $('mobileMenu').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
  $('modalClose').addEventListener('click',closeModal);
  $('modalBackdrop').addEventListener('click',event=>{if(event.target===$('modalBackdrop'))closeModal();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();});
}

/* ========================================================================== */
/* 17. APPLICATION STARTUP                                                     */
/* ========================================================================== */
document.addEventListener('DOMContentLoaded',()=>{
  bindGlobalEvents();
  initializeDashboard();
});

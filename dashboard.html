<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b46">
  <meta name="description" content="ระบบหลังบ้านผู้ดูแลระบบทะเบียนรับ–ส่งหนังสือ">
  <title>Admin Console | ระบบทะเบียนรับ–ส่งหนังสือ</title>

  <!-- Prefer locally installed TH Sarabun PSK; Google Sarabun is only a fallback. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.15.3/dist/sweetalert2.min.css">

  <style>
    /* =====================================================================
       01. DESIGN SYSTEM
       ===================================================================== */
    @font-face { font-family:"TH Sarabun PSK"; src:local("TH Sarabun PSK"),local("TH SarabunPSK"),local("TH Sarabun New"); font-display:swap; }
    :root {
      --font:"TH Sarabun PSK","TH SarabunPSK","TH Sarabun New","Sarabun",sans-serif;
      --navy-950:#091b2d; --navy-900:#102b46; --navy-800:#183b5d; --navy-700:#245178;
      --blue:#2d6ea5; --teal:#167d78; --teal-soft:#e8f5f2; --ink:#172b3d; --muted:#6d7c8b;
      --line:#e2e9ef; --surface:#fff; --surface-soft:#f3f6f9; --success:#14835b; --warning:#b7791f; --danger:#b83a45;
      --radius:15px; --shadow:0 12px 36px rgba(16,43,70,.08);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--surface-soft);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.35;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit} button{cursor:pointer} .hidden{display:none!important} .muted{color:var(--muted)} .small{font-size:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:7px 14px;border-radius:9px;border:1px solid transparent;font-weight:700;transition:.16s}
    .btn:disabled{opacity:.5;cursor:not-allowed}.btn-primary{background:var(--navy-800);color:#fff}.btn-primary:hover{background:var(--navy-900)}.btn-teal{background:var(--teal);color:#fff}.btn-light{background:#fff;border-color:var(--line);color:var(--navy-800)}.btn-light:hover{background:#f0f5f8}.btn-danger{background:#fff2f2;color:var(--danger);border-color:#f0d4d7}.btn-icon{width:36px;min-width:36px;padding:0}
    .control{width:100%;min-height:41px;border:1px solid #d5dfe7;border-radius:9px;padding:8px 11px;background:#fff;color:var(--ink);outline:0}.control:focus{border-color:#23968e;box-shadow:0 0 0 3px rgba(35,150,142,.12)}textarea.control{min-height:82px;resize:vertical}
    .field{display:grid;gap:5px;margin-bottom:11px;text-align:left}.field label{font-size:16px;font-weight:700;color:#334c61}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 14px rgba(16,43,70,.035)}.card-pad{padding:18px}.icon-button{width:38px;height:38px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--navy-800)}

    /* =====================================================================
       02. LOGIN / ACCESS GATE
       ===================================================================== */
    #accessGate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(35,150,142,.12),transparent 30%),linear-gradient(135deg,#0b2035,#173e60)}
    .access-card{width:min(100%,500px);background:#fff;border-radius:20px;padding:32px;box-shadow:0 25px 80px rgba(0,0,0,.23);text-align:center}.access-mark{width:62px;height:62px;margin:0 auto 15px;border-radius:17px;background:var(--navy-900);color:#fff;display:grid;place-items:center;font-size:25px}.access-card h1{margin:0;color:var(--navy-900);font-size:28px}.access-card p{margin:7px 0 18px;color:var(--muted)}

    /* =====================================================================
       03. ADMIN SHELL AND NAVIGATION
       ===================================================================== */
    #adminApp{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr)}
    .sidebar{height:100vh;position:sticky;top:0;display:flex;flex-direction:column;background:var(--navy-950);color:#dbe7ef;z-index:30}
    .brand{padding:20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.09)}.brand-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:20px}.brand-name{font-size:19px;font-weight:700;color:#fff;line-height:1.05}.brand-tag{font-size:11px;letter-spacing:.12em;color:#8fa9bc;margin-top:3px}
    .admin-label{padding:13px 18px 9px;color:#81a0b7;font-size:12px;font-weight:700;letter-spacing:.1em}.nav-list{padding:4px 10px 18px;overflow-y:auto;flex:1}.nav-item{width:100%;display:flex;align-items:center;gap:11px;border:0;border-radius:9px;background:transparent;color:#b8cad7;padding:9px 12px;text-align:left;font-size:16px;margin:2px 0}.nav-item i{width:19px;text-align:center;color:#86a1b6}.nav-item:hover{background:rgba(255,255,255,.075);color:#fff}.nav-item.active{background:linear-gradient(90deg,rgba(35,150,142,.32),rgba(35,150,142,.08));color:#fff;box-shadow:inset 3px 0 #32b3a8}.nav-item.active i{color:#73d4ca}.nav-divider{height:1px;background:rgba(255,255,255,.1);margin:10px 8px}
    .sidebar-bottom{padding:14px 16px;border-top:1px solid rgba(255,255,255,.09)}.admin-user{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:#2f6281;color:#fff;font-weight:700}.admin-user strong{display:block;color:#fff;font-size:15px}.admin-user span{display:block;color:#88a2b5;font-size:12px}
    .main{min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:15;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;backdrop-filter:blur(10px);gap:15px}.top-left{display:flex;align-items:center;gap:12px}.mobile-menu{display:none}.top-title{font-size:22px;color:var(--navy-900);font-weight:700}.top-right{display:flex;align-items:center;gap:9px}.agency-select{width:auto;min-width:220px;max-width:340px}.content{max-width:1700px;margin:0 auto;padding:24px 25px 42px}
    .mobile-overlay{display:none}.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}.page-head h1{font-size:28px;color:var(--navy-900);margin:0}.page-head p{font-size:15px;color:var(--muted);margin:2px 0 0}.page-actions{display:flex;flex-wrap:wrap;gap:8px}

    /* =====================================================================
       04. DASHBOARD CARDS, TABLES AND FORMS
       ===================================================================== */
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}.stat{padding:16px;display:flex;align-items:center;gap:12px}.stat-ico{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#eef4f8;color:var(--blue);font-size:18px}.stat:nth-child(2) .stat-ico{background:#e7f5ef;color:var(--success)}.stat:nth-child(3) .stat-ico{background:#fff3e0;color:var(--warning)}.stat:nth-child(4) .stat-ico{background:#fbecee;color:var(--danger)}.stat strong{display:block;font-size:28px;color:var(--navy-900);line-height:1}.stat span{font-size:14px;color:var(--muted)}
    .grid-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:15px}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h3{margin:0;font-size:19px;color:var(--navy-900)}.panel-body{padding:17px}.chart-area{height:270px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar .control{width:auto;min-width:140px;min-height:39px}.toolbar .search{flex:1;min-width:190px}
    .table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table.data{width:100%;border-collapse:collapse;min-width:720px;font-size:15px}table.data th{padding:10px 11px;text-align:left;white-space:nowrap;background:#eef3f7;color:#3b566b;border-bottom:1px solid var(--line);font-size:14px}table.data td{padding:10px 11px;border-bottom:1px solid #edf1f4;vertical-align:middle}table.data tr:last-child td{border-bottom:0}table.data tbody tr:hover{background:#f8fbfc}.primary-text{color:var(--navy-800);font-weight:700}.sub-text{display:block;color:var(--muted);font-size:12px}.actions{display:flex;align-items:center;gap:5px;white-space:nowrap}.mini{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--navy-700);display:inline-grid;place-items:center}.mini:hover{background:#eef4f8}.mini.danger{color:var(--danger)}.badge{display:inline-flex;padding:3px 8px;border-radius:99px;background:#edf2f6;color:#536779;font-size:12px;font-weight:700}.badge.active,.badge.completed{background:#e6f5ed;color:#13734f}.badge.pending,.badge.in_progress{background:#fff3df;color:#976019}.badge.inactive,.badge.cancelled{background:#fbe9ea;color:#aa3942}.empty{padding:38px 14px;text-align:center;color:var(--muted)}.empty i{display:block;font-size:30px;margin-bottom:9px;color:#aab8c3}.empty strong{display:block;color:var(--navy-800);font-size:17px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.form-grid .full{grid-column:1/-1}.info-note{border-radius:9px;padding:10px 12px;background:#eef5f8;color:#49677e;font-size:14px;text-align:left}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;background:#eef4f8;border-radius:99px;color:#38576e;font-size:13px}.metric-list{display:grid;gap:9px}.metric-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f4}.metric-row:last-child{border-bottom:0}
    .swal2-popup{font-family:var(--font)!important;font-size:18px!important;border-radius:17px!important}.swal2-title{font-size:25px!important;color:var(--navy-900)!important}.swal2-html-container{color:var(--ink)!important}.permission-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;text-align:left;max-height:300px;overflow:auto;padding:8px}.permission-item{padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px}.permission-item input{accent-color:var(--teal);margin-right:7px}
    @media(max-width:1150px){#adminApp{grid-template-columns:235px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}}
    @media(max-width:850px){#adminApp{display:block}.sidebar{position:fixed;left:-280px;top:0;width:270px;transition:left .22s;box-shadow:10px 0 30px rgba(0,0,0,.18)}.sidebar.open{left:0}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(5,18,30,.42);z-index:25}.mobile-menu{display:grid}.topbar{height:62px;padding:0 13px}.agency-select{min-width:145px;max-width:185px;font-size:14px}.top-title{font-size:18px}.content{padding:17px 13px 28px}.grid-2{grid-template-columns:1fr}}
    @media(max-width:540px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:11px;gap:8px}.stat-ico{width:36px;height:36px;font-size:15px}.stat strong{font-size:24px}.stat span{font-size:12px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.permission-grid{grid-template-columns:1fr}.page-actions{width:100%}.page-actions .btn{flex:1}}
  </style>
</head>
<body>

      <p id="accessMessage">กำลังตรวจสอบสิทธิ์ผู้ดูแลระบบ</p>
      <button class="btn btn-primary" id="returnLoginBtn"><i class="fa-solid fa-arrow-left"></i> กลับหน้าเข้าสู่ระบบ</button>

  <!-- ===================================================================
       06. ADMIN APPLICATION SHELL
       =================================================================== -->
  <div id="adminApp" class="hidden">
    <div id="mobileOverlay" class="mobile-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-icon"><i class="fa-solid fa-landmark"></i></div><div><div class="brand-name">ทะเบียนหนังสือ</div><div class="brand-tag">ADMINISTRATION SYSTEM</div></div></div>

    <main class="main">

  <!-- ===================================================================
       07. EXTERNAL LIBRARIES
       =================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.15.3/dist/sweetalert2.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <script>
    'use strict';

    /* =====================================================================
       08. CONFIGURATION AND STATE
       ===================================================================== */
    const ADMIN_CONFIG=Object.freeze({
      // Set this to the same API Gateway endpoint used by index.html.
      API_GATEWAY_URL:'https://document-registry-api.sisosoawooaoo.workers.dev/api',
      PAGE_SIZE:100,
      MAX_UPLOAD_BYTES:8*1024*1024,
      TIMEZONE:'Asia/Bangkok'
    });
    const state={user:null,agency:null,permissions:[],agencies:[],selectedAgencyId:'',view:'overview',chart:null,lookups:{users:[],departments:[],roles:[],permissions:[],documentTypes:[],categories:[]}};
    const $=(selector,root=document)=>root.querySelector(selector);
    const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const list=value=>Array.isArray(value)?value:(Array.isArray(value?.items)?value.items:[]);
    const dateText=value=>{if(!value)return '-';const d=new Date(String(value).slice(0,10)+'T00:00:00');return Number.isNaN(d.getTime())?esc(value):new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(d);};
    const statusText=value=>({ACTIVE:'ใช้งาน',INACTIVE:'ระงับ',RECEIVED:'รับเข้าแล้ว',PENDING:'รอดำเนินการ',IN_PROGRESS:'อยู่ระหว่างดำเนินการ',COMPLETED:'ดำเนินการแล้ว',REGISTERED:'ลงทะเบียนแล้ว',CANCELLED:'ยกเลิก'}[String(value||'').toUpperCase()]||value||'-');
    const statusClass=value=>String(value||'').toLowerCase().replace(/[^a-z_]/g,'');
    const currentAgencyId=()=>state.selectedAgencyId||(state.agency?.agencyId||state.user?.agencyId||'');
    const isSuper=()=>!!state.user?.isSuperAdmin;
    const hasAccess=permission=>isSuper()||state.permissions.includes('*')||state.permissions.includes(permission);
    const gatewayReady=()=>ADMIN_CONFIG.API_GATEWAY_URL&&!ADMIN_CONFIG.API_GATEWAY_URL.includes('YOUR-CLOUDFLARE-WORKER');

    /* =====================================================================
       09. API CLIENT - API GATEWAY OWNS THE HTTP-ONLY SESSION COOKIE
       ===================================================================== */
    async function api(action,data={}){
      if(!gatewayReady())throw new Error('กรุณากำหนด API_GATEWAY_URL ใน dashboard.html ให้ตรงกับ API Gateway ที่ Deploy แล้ว');
      let response;
      try{response=await fetch(ADMIN_CONFIG.API_GATEWAY_URL,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data,userAgent:navigator.userAgent})});}
      catch(error){throw new Error('เชื่อมต่อ API Gateway ไม่สำเร็จ กรุณาตรวจสอบ URL และ CORS');}
      let payload;try{payload=await response.json();}catch(error){throw new Error('API Gateway ไม่ได้ส่ง JSON กลับมา');}
      if(!response.ok||payload.ok===false)throw new Error(payload.message||payload.error||`HTTP ${response.status}`);
      return payload.ok===true&&Object.prototype.hasOwnProperty.call(payload,'data')?payload.data:(payload.data??payload);
    }

    /* =====================================================================
       10. UI UTILITIES, ALERTS AND FILE TRANSFER
       ===================================================================== */
    const Toast=Swal.mixin({toast:true,position:'top-end',showConfirmButton:false,timer:3000,timerProgressBar:true});
    const toast=(message,icon='success')=>Toast.fire({icon,title:message});
    const errorAlert=error=>Swal.fire({icon:'error',title:'ดำเนินการไม่สำเร็จ',text:error?.message||String(error),confirmButtonText:'รับทราบ'});
    async function busy(title,fn){Swal.fire({title:title||'กำลังประมวลผล',allowOutsideClick:false,allowEscapeKey:false,didOpen:()=>Swal.showLoading()});try{const result=await fn();Swal.close();return result;}catch(error){Swal.close();errorAlert(error);throw error;}}
    function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));reader.readAsDataURL(file);});}
    function base64Blob(base64,mime){const raw=atob(base64),parts=[];for(let offset=0;offset<raw.length;offset+=1024*1024){const s=raw.slice(offset,offset+1024*1024),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);parts.push(a);}return new Blob(parts,{type:mime||'application/octet-stream'});}
    function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name||'download';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
    function saveApiFile(result){if(!result?.fileBase64)throw new Error('ไม่พบเนื้อหาไฟล์จาก API');saveBlob(base64Blob(result.fileBase64,result.mimeType),result.fileName||'document');}

      $('#contentArea').innerHTML=`<div class="page-head"><div><div class="eyebrow">USER MANAGEMENT</div><h1>จัดการผู้ใช้งาน</h1><p>สร้างบัญชี กำหนดบทบาท ระงับบัญชี และรีเซ็ตรหัสผ่าน</p></div><div class="page-actions"><button class="btn btn-primary" onclick="openUserForm()"><i class="fa-solid fa-user-plus"></i> เพิ่มผู้ใช้งาน</button></div></div><div class="card card-pad"><div class="toolbar"><input class="control search" id="userSearch" placeholder="ค้นหาชื่อผู้ใช้ ชื่อ หรืออีเมล"><select class="control" id="userStatus"><option value="">ทุกสถานะ</option><option value="ACTIVE">ใช้งาน</option><option value="INACTIVE">ระงับ</option></select></div><div class="table-wrap"><table class="data"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อแสดง</th><th>อีเมล</th><th>ตำแหน่ง</th><th>บทบาท</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="userRows">${userRowsHtml(rows)}</tbody></table></div></div>`;
      $('#userSearch').addEventListener('input',filterUsers);$('#userStatus').addEventListener('change',filterUsers);
      $('#userRows').addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const u=rows.find(x=>x.userId===b.dataset.id);if(!u)return;if(b.dataset.action==='edit')openUserForm(u);if(b.dataset.action==='reset')resetUserPassword(u);if(b.dataset.action==='deactivate')deactivateUser(u);});
    }
    function userRowsHtml(rows){return rows.length?rows.map(u=>`<tr data-search="${esc((u.username+' '+u.displayName+' '+u.email).toLowerCase())}" data-status="${esc(u.status)}"><td class="primary-text">${esc(u.username)}</td><td>${esc(u.displayName||'-')}</td><td>${esc(u.email||'-')}</td><td>${esc(u.position||'-')}</td><td>${esc(state.lookups.roles.find(r=>r.role_id===u.roleId)?.role_name||'-')}</td><td><span class="badge ${statusClass(u.status)}">${statusText(u.status)}</span></td><td><div class="actions"><button class="mini" data-action="edit" data-id="${esc(u.userId)}"><i class="fa-regular fa-pen-to-square"></i></button><button class="mini" data-action="reset" data-id="${esc(u.userId)}" title="รีเซ็ตรหัสผ่าน"><i class="fa-solid fa-key"></i></button><button class="mini danger" data-action="deactivate" data-id="${esc(u.userId)}"><i class="fa-solid fa-user-slash"></i></button></div></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty"><i class="fa-solid fa-users"></i><strong>ยังไม่มีบัญชีผู้ใช้</strong></div></td></tr>';}
    function filterUsers(){const q=$('#userSearch').value.toLowerCase(),s=$('#userStatus').value;$$('#userRows tr').forEach(r=>r.hidden=!(r.dataset.search||'').includes(q)||!!s&&r.dataset.status!==s);}
    async function openUserForm(existing=null){
      const u=existing||{};if(!state.lookups.roles.length)await loadLookups();
      const html=`<div class="form-grid"><div class="field"><label>ชื่อผู้ใช้ *</label><input class="control" id="uUsername" value="${esc(u.username||'')}" ${existing?'disabled':''}></div><div class="field"><label>ชื่อที่แสดง *</label><input class="control" id="uDisplay" value="${esc(u.displayName||'')}"></div><div class="field"><label>ชื่อจริง</label><input class="control" id="uFirst" value="${esc(u.firstName||'')}"></div><div class="field"><label>นามสกุล</label><input class="control" id="uLast" value="${esc(u.lastName||'')}"></div><div class="field"><label>อีเมล</label><input class="control" id="uEmail" type="email" value="${esc(u.email||'')}"></div><div class="field"><label>โทรศัพท์</label><input class="control" id="uPhone" value="${esc(u.phone||'')}"></div><div class="field"><label>ตำแหน่ง</label><input class="control" id="uPosition" value="${esc(u.position||'')}"></div><div class="field"><label>ฝ่าย/กลุ่มงาน</label><select class="control" id="uDepartment"><option value="">ไม่ระบุ</option>${state.lookups.departments.map(d=>`<option value="${esc(d.department_id)}" ${u.departmentId===d.department_id?'selected':''}>${esc(d.department_name)}</option>`).join('')}</select></div><div class="field"><label>บทบาท *</label><select class="control" id="uRole">${state.lookups.roles.filter(r=>r.is_active!==false&&r.role_code!=='SUPER_ADMIN').map(r=>`<option value="${esc(r.role_id)}" ${u.roleId===r.role_id?'selected':''}>${esc(r.role_name)}</option>`).join('')}</select></div>${existing?`<div class="field"><label>สถานะบัญชี</label><select class="control" id="uStatus"><option value="ACTIVE" ${u.status==='ACTIVE'?'selected':''}>ใช้งาน</option><option value="INACTIVE" ${u.status==='INACTIVE'?'selected':''}>ระงับ</option></select></div>`:`<div class="field"><label>รหัสผ่านเริ่มต้น *</label><input class="control" type="password" id="uPassword" autocomplete="new-password"></div><div class="field full"><label class="check-line"><input type="checkbox" id="uMustChange" checked> บังคับเปลี่ยนรหัสผ่านเมื่อเข้าสู่ระบบครั้งแรก</label></div>`}</div><div class="info-note">ชื่อผู้ใช้ต้องมี 3–64 ตัวอักษร และรหัสผ่านต้องมีอย่างน้อย 12 ตัวอักษร</div>`;
      const r=await Swal.fire({title:existing?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งาน',html,width:760,showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',preConfirm:()=>{const data={displayName:$('#uDisplay').value.trim(),firstName:$('#uFirst').value.trim(),lastName:$('#uLast').value.trim(),email:$('#uEmail').value.trim(),phone:$('#uPhone').value.trim(),position:$('#uPosition').value.trim(),departmentId:$('#uDepartment').value,roleId:$('#uRole').value};if(existing){data.userId=u.userId;data.status=$('#uStatus').value;}else{data.agencyId=currentAgencyId();data.username=$('#uUsername').value.trim();data.password=$('#uPassword').value;data.mustChangePassword=$('#uMustChange').checked;if(!data.username||data.password.length<12||!data.displayName){Swal.showValidationMessage('กรอกชื่อผู้ใช้ ชื่อแสดง และรหัสผ่านอย่างน้อย 12 ตัวอักษร');return false;}}return data;}});
      if(!r.isConfirmed)return;const payload=r.value;
      await busy('กำลังบันทึกบัญชี',()=>api(existing?'users.update':'users.create',payload));toast(existing?'แก้ไขผู้ใช้แล้ว':'สร้างบัญชีผู้ใช้แล้ว');await renderUsers();
    }
    async function resetUserPassword(u){const r=await Swal.fire({title:'รีเซ็ตรหัสผ่าน?',text:`ระบบจะสร้างรหัสผ่านชั่วคราวให้ ${u.username}`,icon:'warning',showCancelButton:true,confirmButtonText:'รีเซ็ตรหัสผ่าน',cancelButtonText:'ยกเลิก'});if(!r.isConfirmed)return;const result=await busy('กำลังรีเซ็ตรหัสผ่าน',()=>api('users.resetPassword',{agencyId:currentAgencyId(),userId:u.userId}));await Swal.fire({title:'รหัสผ่านชั่วคราว',html:`<div class="info-note">รหัสนี้แสดงเพียงครั้งเดียว กรุณาคัดลอกและส่งมอบผู้ใช้งานผ่านช่องทางที่ปลอดภัย</div><div style="font-family:monospace;background:#f2f5f7;padding:13px;border-radius:8px;margin:12px 0;word-break:break-all" id="tempPassValue">${esc(result.temporaryPassword)}</div><button id="copyTempPass" class="btn btn-primary"><i class="fa-regular fa-copy"></i> คัดลอก</button>`,showConfirmButton:true,confirmButtonText:'ปิด',didOpen:()=>$('#copyTempPass').addEventListener('click',()=>navigator.clipboard.writeText(result.temporaryPassword).then(()=>toast('คัดลอกแล้ว')))});}
    async function deactivateUser(u){const r=await Swal.fire({title:'ระงับบัญชีผู้ใช้นี้?',text:'ผู้ใช้จะไม่สามารถเข้าสู่ระบบได้',icon:'warning',showCancelButton:true,confirmButtonText:'ระงับบัญชี',cancelButtonText:'ยกเลิก',confirmButtonColor:'#b83a45'});if(!r.isConfirmed)return;await busy('กำลังระงับบัญชี',()=>api('users.deactivate',{userId:u.userId}));toast('ระงับบัญชีแล้ว');renderUsers();}

    async function renderDepartments(){
      const rows=list(await api('departments.list',{...currentAgencyPayload(),includeInactive:true,page:1,pageSize:200}));state.lookups.departments=rows;
      $('#contentArea').innerHTML=`<div class="page-head"><div><div class="eyebrow">ORGANIZATION STRUCTURE</div><h1>ฝ่ายและกลุ่มงาน</h1><p>กำหนดโครงสร้างภายในหน่วยงานและผู้รับผิดชอบ</p></div><div class="page-actions"><button class="btn btn-primary" onclick="openDepartmentForm()"><i class="fa-solid fa-plus"></i> เพิ่มฝ่าย/กลุ่มงาน</button></div></div><div class="card card-pad"><div class="table-wrap"><table class="data"><thead><tr><th>รหัส</th><th>ชื่อฝ่าย/กลุ่มงาน</th><th>หัวหน้าฝ่าย</th><th>โทรศัพท์</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.length?rows.map(d=>`<tr><td>${esc(d.department_code)}</td><td class="primary-text">${esc(d.department_name)}</td><td>${esc(state.lookups.users.find(u=>u.user_id===d.head_user_id)?.display_name||'-')}</td><td>${esc(d.phone||'-')}</td><td><span class="badge ${statusClass(d.status)}">${statusText(d.status)}</span></td><td><div class="actions"><button class="mini" data-edit="${esc(d.department_id)}"><i class="fa-regular fa-pen-to-square"></i></button><button class="mini danger" data-off="${esc(d.department_id)}"><i class="fa-solid fa-ban"></i></button></div></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">ยังไม่มีฝ่ายหรือกลุ่มงาน</div></td></tr>'}</tbody></table></div></div>`;
      $('#contentArea tbody').addEventListener('click',event=>{const e=event.target.closest('[data-edit]'),off=event.target.closest('[data-off]');if(e)openDepartmentForm(rows.find(d=>d.department_id===e.dataset.edit));if(off)deactivateDepartment(off.dataset.off);});
    }
    async function openDepartmentForm(d=null){const r=await Swal.fire({title:d?'แก้ไขฝ่าย/กลุ่มงาน':'เพิ่มฝ่าย/กลุ่มงาน',html:`<div class="field"><label>รหัสฝ่าย</label><input id="depCode" class="swal2-input" value="${esc(d?.department_code||'')}"></div><div class="field"><label>ชื่อฝ่าย/กลุ่มงาน *</label><input id="depName" class="swal2-input" value="${esc(d?.department_name||'')}"></div><div class="field"><label>หัวหน้าฝ่าย</label><select id="depHead" class="swal2-select"><option value="">ไม่ระบุ</option>${state.lookups.users.map(u=>`<option value="${esc(u.userId||u.user_id)}" ${(d?.head_user_id===(u.userId||u.user_id))?'selected':''}>${esc(u.displayName||u.display_name)}</option>`).join('')}</select></div><div class="field"><label>โทรศัพท์</label><input id="depPhone" class="swal2-input" value="${esc(d?.phone||'')}"></div>`,showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',preConfirm:()=>{if(!$('#depName').value.trim()){Swal.showValidationMessage('กรุณาระบุชื่อฝ่าย');return false;}return {departmentCode:$('#depCode').value.trim(),departmentName:$('#depName').value.trim(),headUserId:$('#depHead').value,phone:$('#depPhone').value};}});if(!r.isConfirmed)return;const payload={...r.value,agencyId:currentAgencyId()};await busy('กำลังบันทึกฝ่าย',()=>api(d?'departments.update':'departments.create',d?{...payload,departmentId:d.department_id}:payload));toast('บันทึกข้อมูลแล้ว');renderDepartments();}
    async function deactivateDepartment(id){const r=await Swal.fire({title:'ระงับฝ่าย/กลุ่มงาน?',icon:'warning',showCancelButton:true,confirmButtonText:'ระงับ',cancelButtonText:'ยกเลิก'});if(!r.isConfirmed)return;await api('departments.deactivate',{departmentId:id});toast('ระงับแล้ว');renderDepartments();}

    async function renderRoles(){
      const [roles,permissions]=await Promise.all([api('roles.list',{...currentAgencyPayload(),includeInactive:true,page:1,pageSize:200}),api('permissions.list',{})]);state.lookups.roles=list(roles);state.lookups.permissions=list(permissions);
      $('#contentArea').innerHTML=`<div class="page-head"><div><div class="eyebrow">ROLE BASED ACCESS</div><h1>บทบาทและสิทธิ์</h1><p>กำหนดระดับการใช้งานและรายการสิทธิ์ของแต่ละบทบาท</p></div><div class="page-actions"><button class="btn btn-primary" onclick="openRoleForm()"><i class="fa-solid fa-plus"></i> สร้างบทบาท</button></div></div><div class="card card-pad"><div class="table-wrap"><table class="data"><thead><tr><th>รหัสบทบาท</th><th>ชื่อบทบาท</th><th>รายละเอียด</th><th>ประเภท</th><th>สิทธิ์</th><th>จัดการ</th></tr></thead><tbody>${state.lookups.roles.map(r=>`<tr><td>${esc(r.role_code)}</td><td class="primary-text">${esc(r.role_name)}</td><td>${esc(r.role_description||'')}</td><td>${r.is_system_role?'บทบาทระบบ':'กำหนดเอง'}</td><td>${(r.permissionCodes||[]).length}</td><td><button class="mini" data-role="${esc(r.role_id)}"><i class="fa-regular fa-pen-to-square"></i></button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">ยังไม่มีบทบาท</div></td></tr>'}</tbody></table></div></div>`;

    async function openRoleForm(role=null){
      const selected=role?.permissionCodes||[];const html=`<div class="form-grid"><div class="field"><label>รหัสบทบาท</label><input id="roleCode" class="control" value="${esc(role?.role_code||'')}" ${role?'disabled':''}></div><div class="field"><label>ชื่อบทบาท</label><input id="roleName" class="control" value="${esc(role?.role_name||'')}"></div><div class="field full"><label>รายละเอียด</label><textarea id="roleDesc" class="control">${esc(role?.role_description||'')}</textarea></div></div><div class="field"><label>กำหนดสิทธิ์</label><div class="permission-grid">${state.lookups.permissions.map(p=>`<label class="permission-item"><input type="checkbox" value="${esc(p.permission_code)}" ${selected.includes(p.permission_code)?'checked':''}>${esc(p.permission_name)} <span class="muted">(${esc(p.permission_code)})</span></label>`).join('')}</div></div>`;
      const r=await Swal.fire({title:role?'แก้ไขบทบาทและสิทธิ์':'สร้างบทบาทใหม่',html,width:850,showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',preConfirm:()=>{const permissionCodes=$$('.permission-grid input:checked').map(x=>x.value);const roleName=$('#roleName').value.trim();if(!roleName){Swal.showValidationMessage('กรุณาระบุชื่อบทบาท');return false;}return {roleCode:$('#roleCode').value.trim().toUpperCase(),roleName,description:$('#roleDesc').value,permissionCodes};}});if(!r.isConfirmed)return;const p={...r.value,agencyId:currentAgencyId()};
      await busy('กำลังบันทึกบทบาท',async()=>{if(role){await api('roles.update',{roleId:role.role_id,roleName:p.roleName,description:p.description});await api('roles.setPermissions',{roleId:role.role_id,permissionCodes:p.permissionCodes});}else await api('roles.create',p);});toast('บันทึกบทบาทแล้ว');renderRoles();
    }

    async function renderBooks(type,filters={}){
      const incoming=type==='INCOMING',action=incoming?'books.incoming.list':'books.outgoing.list';const rows=list(await api(action,{...currentAgencyPayload(),page:1,pageSize:200,...filters}));
      const title=incoming?'ทะเบียนหนังสือรับ':'ทะเบียนหนังสือส่ง';const dateField=incoming?'receivedDate':'sentDate';const partyField=incoming?'senderAgency':'recipientAgency';
      $('#contentArea').innerHTML=`<div class="page-head"><div><div class="eyebrow">REGISTRY MANAGEMENT</div><h1>${title}</h1><p>ตรวจสอบ แก้ไข ยกเลิก และพิมพ์ทะเบียนของหน่วยงาน</p></div><div class="page-actions"><button class="btn btn-primary" onclick="openBookForm('${type}')"><i class="fa-solid fa-plus"></i> เพิ่มทะเบียน</button><button class="btn btn-light" onclick="printRegistry('${type}')"><i class="fa-solid fa-file-pdf"></i> พิมพ์ PDF</button></div></div><div class="card card-pad"><div class="toolbar"><input class="control search" id="bookSearch" placeholder="ค้นหาเลขทะเบียน เลขที่หนังสือ เรื่อง"><select class="control" id="bookStatus"><option value="">ทุกสถานะ</option><option value="RECEIVED">รับเข้าแล้ว</option><option value="PENDING">รอดำเนินการ</option><option value="IN_PROGRESS">อยู่ระหว่างดำเนินการ</option><option value="COMPLETED">เสร็จสิ้น</option></select><button class="btn btn-light" id="bookFilter"><i class="fa-solid fa-filter"></i> กรอง</button></div><div class="table-wrap"><table class="data"><thead><tr><th>เลขทะเบียน</th><th>วันที่</th><th>เลขที่หนังสือ</th><th>จาก/ถึง</th><th>เรื่อง</th><th>ชั้นความเร็ว</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead><tbody>${rows.length?rows.map(b=>`<tr><td class="primary-text">${esc(b.registrationNo)}</td><td>${dateText(b[dateField])}</td><td>${esc(b.documentNumber||'-')}</td><td>${esc(b[partyField]||'-')}</td><td>${esc(b.subject||'-')}</td><td>${esc(b.priorityLevel||'-')}</td><td><span class="badge ${statusClass(b.status)}">${statusText(b.status)}</span></td><td><div class="actions"><button class="mini" data-view="${esc(b.bookId)}"><i class="fa-regular fa-eye"></i></button><button class="mini" data-edit="${esc(b.bookId)}"><i class="fa-regular fa-pen-to-square"></i></button><button class="mini danger" data-cancel="${esc(b.bookId)}"><i class="fa-solid fa-ban"></i></button></div></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty"><i class="fa-regular fa-folder-open"></i><strong>ยังไม่มีทะเบียน</strong></div></td></tr>'}</tbody></table></div></div>`;
      $('#bookFilter').addEventListener('click',()=>renderBooks(type,{search:$('#bookSearch').value.trim(),status:$('#bookStatus').value}));
      $('#contentArea tbody').addEventListener('click',event=>{const b=event.target.closest('[data-view],[data-edit],[data-cancel]');if(!b)return;const row=rows.find(x=>x.bookId===b.dataset.view||x.bookId===b.dataset.edit||x.bookId===b.dataset.cancel);if(!row)return;if(b.dataset.view)viewBook(type,row.bookId);if(b.dataset.edit)openBookForm(type,row);if(b.dataset.cancel)cancelBook(type,row.bookId);});
    }

    async function renderFiles(){
      const rows=list(await api('attachments.list',{...currentAgencyPayload(),page:1,pageSize:200}));
      $('#contentArea').innerHTML=`<div class="page-head"><div><div class="eyebrow">PRIVATE DOCUMENT STORAGE</div><h1>จัดการไฟล์เอกสาร</h1><p>ไฟล์จัดเก็บใน Google Drive แบบ Private และดาวน์โหลดผ่าน API โดยตรง</p></div><div class="page-actions"><button class="btn btn-primary" onclick="uploadGeneralFile()"><i class="fa-solid fa-upload"></i> อัปโหลดไฟล์</button></div></div><div class="card card-pad"><div class="table-wrap"><table class="data"><thead><tr><th>ชื่อไฟล์</th><th>ประเภท MIME</th><th>ขนาด</th><th>หมวดหมู่</th><th>วันที่</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.map(a=>`<tr><td class="primary-text">${esc(a.fileName)}</td><td>${esc(a.mimeType)}</td><td>${(Number(a.sizeBytes||0)/1024).toFixed(1)} KB</td><td>${esc(a.category||'-')}</td><td>${dateText(a.uploadedAt)}</td><td><span class="badge ${statusClass(a.status)}">${statusText(a.status)}</span></td><td><div class="actions"><button class="mini" data-download="${esc(a.attachmentId)}"><i class="fa-solid fa-download"></i></button><button class="mini danger" data-delete="${esc(a.attachmentId)}"><i class="fa-regular fa-trash-can"></i></button></div></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">ยังไม่มีไฟล์เอกสาร</div></td></tr>'}</tbody></table></div></div>`;
      const tbody=$('#contentArea tbody');
      tbody?.addEventListener('click',async event=>{
        const downloadButton=event.target.closest('[data-download]');
        const deleteButton=event.target.closest('[data-delete]');
        try{
          if(downloadButton)await downloadAttachment(downloadButton.dataset.download);
          if(deleteButton)await deleteAttachment(deleteButton.dataset.delete);
        }catch(error){errorAlert(error);}
      });

    async function uploadGeneralFile(){if(isSuper()&&currentAgencyId()==='*'&&!(await ensureAgencySelected()))return;const input=document.createElement('input');input.type='file';input.accept='.pdf,.doc,.docx,.xls,.xlsx,.txt,.jpg,.jpeg,.png,.webp,.gif';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;if(f.size>ADMIN_CONFIG.MAX_UPLOAD_BYTES)return toast('ไฟล์มีขนาดเกิน 8 MB','warning');const data=await fileToDataUrl(f);await busy('กำลังอัปโหลด',()=>api('attachments.upload',{...currentAgencyPayload(),fileName:f.name,mimeType:f.type,fileBase64:data,folderType:'Attachments',category:'GENERAL'}));toast('อัปโหลดไฟล์แล้ว');renderFiles();};input.click();}
    async function downloadAttachment(id){const file=await busy('กำลังดาวน์โหลด',()=>api('attachments.download',{...currentAgencyPayload(),attachmentId:id}));saveApiFile(file);toast('เริ่มดาวน์โหลดแล้ว');}
    async function deleteAttachment(id){const r=await Swal.fire({title:'ยกเลิกไฟล์แนบ?',text:'ไฟล์ต้นฉบับใน Drive จะยังคงอยู่ แต่ระบบจะปิดการเข้าถึง',icon:'warning',showCancelButton:true,confirmButtonText:'ยกเลิกไฟล์',cancelButtonText:'กลับ'});if(!r.isConfirmed)return;await api('attachments.delete',{attachmentId:id});toast('ยกเลิกไฟล์แล้ว');renderFiles();}

    async function openLookupForm(type,existing=null){

        return typeMode?{...common,agencyId:currentAgencyId(),typeCode:$('#lkCode').value.trim(),typeName:name}:{...common,agencyId:currentAgencyId(),categoryCode:$('#lkCode').value.trim(),categoryName:name};
      }});

        await api(prefix+'create',r.value);

    }

    async function printRegistry(type,filters={}){
      const report=await busy('กำลังโหลดข้อมูลรายงาน',()=>api('pdf.registryData',{...currentAgencyPayload(),bookType:type,year:filters.year||'',limit:181}));

      const blob=await renderPdfCanvas(report);const base64=await blobBase64(blob);
      const encrypted=await busy('กำลังเข้ารหัส PDF',()=>api('pdf.encryptAndStore',{...currentAgencyPayload(),pdfBase64:base64,fileName:`${report.reportTitle}_${report.fiscalYear}.pdf`,purpose:'REGISTRY_REPORT'}));
      saveApiFile(encrypted);await passwordPopup(encrypted.passwordForClipboard,encrypted.fileName);
    }
    function blobBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(new Error('แปลงไฟล์ PDF ไม่สำเร็จ'));r.readAsDataURL(blob);});}
    async function renderPdfCanvas(report){
      await document.fonts.ready;const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});const W=3508,H=2480,M=105,usable=W-M*2,rows=report.rows||[],perPage=17,pages=Math.max(1,Math.ceil(rows.length/perPage)),incoming=report.bookType==='INCOMING';
      const columns=incoming?[['เลขทะเบียนรับ','registrationNo',.11],['วันที่รับ','receivedDate',.09],['เลขที่หนังสือ','documentNumber',.12],['ลงวันที่','documentDate',.09],['จาก','senderAgency',.13],['เรื่อง','subject',.22],['ความเร็ว','priorityLevel',.08],['ผู้รับผิดชอบ','responsibleUserId',.10],['สถานะ','status',.06]]:[['เลขทะเบียนส่ง','registrationNo',.11],['วันที่ส่ง','sentDate',.09],['เลขที่หนังสือ','documentNumber',.12],['ลงวันที่','documentDate',.09],['ถึง','recipientAgency',.13],['เรื่อง','subject',.22],['ความเร็ว','priorityLevel',.08],['ผู้ลงนาม','signatoryName',.10],['สถานะ','status',.06]];
      for(let p=0;p<pages;p++){
        const c=document.createElement('canvas');c.width=2480;c.height=1754;const ctx=c.getContext('2d');ctx.scale(c.width/W,c.height/H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);let logo=false;
        if(report.agency?.logoUrl){try{const img=new Image();img.crossOrigin='anonymous';img.src=report.agency.logoUrl;await img.decode();ctx.drawImage(img,W/2-60,48,120,120);logo=true;}catch(e){logo=false;}}
        ctx.fillStyle='#172b3d';ctx.textAlign='center';ctx.font='bold 54px "TH Sarabun PSK","TH Sarabun New",Sarabun,sans-serif';const y=logo?235:145;ctx.fillText(report.agency?.agencyName||'ชื่อหน่วยงาน',W/2,y);ctx.font='bold 46px "TH Sarabun PSK","TH Sarabun New",Sarabun,sans-serif';ctx.fillText(`${report.reportTitle} ประจำปีงบประมาณ พ.ศ. ${report.fiscalYear}`,W/2,y+65);ctx.textAlign='left';ctx.font='29px "TH Sarabun PSK","TH Sarabun New",Sarabun,sans-serif';ctx.fillText(`พิมพ์เมื่อ ${dateText(report.generatedAt)} • ${report.total} รายการ`,M,y+120);
        const top=y+170,headH=70,rowH=92;let x=M;ctx.fillStyle='#eaf0f5';ctx.fillRect(M,top,usable,headH);
        columns.forEach(col=>{col.x=x;col.width=usable*col[2];ctx.strokeStyle='#52697a';ctx.lineWidth=2;ctx.strokeRect(x,top,col.width,headH);ctx.textAlign='center';ctx.fillStyle='#183b5d';ctx.font='bold 29px "TH Sarabun PSK","TH Sarabun New",Sarabun,sans-serif';ctx.fillText(col[0],x+col.width/2,top+44);x+=col.width;});
        rows.slice(p*perPage,(p+1)*perPage).forEach((r,i)=>{let cellX=M;const yRow=top+headH+i*rowH;columns.forEach(col=>{ctx.strokeStyle='#8b9aa5';ctx.lineWidth=1.3;ctx.strokeRect(cellX,yRow,col.width,rowH);let val=r[col[1]]||'';if(col[1]==='responsibleUserId')val=state.lookups.users.find(u=>u.user_id===val)?.display_name||'';if(['receivedDate','sentDate','documentDate'].includes(col[1]))val=val?dateText(val):'';if(col[1]==='status')val=statusText(val);ctx.textAlign=col[1]==='subject'?'left':'center';ctx.fillStyle='#1f2937';ctx.font='26px "TH Sarabun PSK","TH Sarabun New",Sarabun,sans-serif';wrapText(ctx,String(val),cellX+(col[1]==='subject'?10:5),yRow+34,col.width-12,30);cellX+=col.width;});});
        ctx.textAlign='left';ctx.fillStyle='#526273';ctx.font='24px "TH Sarabun PSK","TH Sarabun New",Sarabun,sans-serif';ctx.fillText('ระบบทะเบียนรับ–ส่งหนังสืออิเล็กทรอนิกส์',M,H-70);ctx.textAlign='right';ctx.fillText(`หน้า ${p+1}/${pages}`,W-M,H-70);if(p)pdf.addPage('a4','landscape');pdf.addImage(c.toDataURL('image/jpeg',.88),'JPEG',0,0,297,210,undefined,'FAST');
      }

    }
    function wrapText(ctx,text,x,y,maxWidth,lineHeight){let words=String(text||'').split(/\s+/),line='',lines=[];words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxWidth&&line){lines.push(line);line=w;}else line=t;});if(line)lines.push(line);lines.slice(0,2).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));}

       26. BACKUP AND RESTORE
       ===================================================================== */
    async function renderBackups(){if(!isSuper())throw new Error('การสำรองและกู้คืนข้อมูลทั้งหมดอนุญาตเฉพาะ Super Admin');const rows=list(await api('backup.list',{page:1,pageSize:200}));$('#contentArea').innerHTML=`<div class="page-head"><div><div class="eyebrow">DISASTER RECOVERY</div><h1>สำรองและกู้คืนข้อมูล</h1><p>สำรองฐานข้อมูลทั้งหมดเก็บใน Google Drive แบบ Private</p></div><div class="page-actions"><button class="btn btn-primary" id="createBackup"><i class="fa-solid fa-database"></i> สำรองข้อมูลทันที</button></div></div><div class="info-note" style="margin-bottom:13px">การกู้คืนจะเขียนทับข้อมูลใน Google Sheets ทุกตาราง ควรสร้าง Backup ล่าสุดก่อนดำเนินการ</div><div class="card card-pad"><div class="table-wrap"><table class="data"><thead><tr><th>ชื่อไฟล์สำรอง</th><th>วันเวลาสร้าง</th><th>จำนวนแถว</th><th>สถานะ</th><th>ผู้สร้าง</th><th>จัดการ</th></tr></thead><tbody>${rows.map(b=>`<tr><td class="primary-text">${esc(b.file_name)}</td><td>${dateText(b.created_at)}</td><td>${Number(b.row_count||0).toLocaleString('th-TH')}</td><td><span class="badge ${statusClass(b.status)}">${esc(b.status)}</span></td><td>${esc(b.created_by)}</td><td><button class="btn btn-danger" data-restore="${esc(b.backup_id)}">กู้คืนข้อมูล</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">ยังไม่มีข้อมูลสำรอง</div></td></tr>'}</tbody></table></div></div>`;
      $('#createBackup').addEventListener('click',async()=>{const r=await Swal.fire({title:'สร้างข้อมูลสำรอง?',input:'text',inputLabel:'หมายเหตุ (ไม่บังคับ)',showCancelButton:true,confirmButtonText:'เริ่มสำรอง',cancelButtonText:'ยกเลิก'});if(!r.isConfirmed)return;await busy('กำลังสำรองข้อมูล',()=>api('backup.create',{notes:r.value||''}));toast('สร้างข้อมูลสำรองแล้ว');renderBackups();});
      $('#contentArea').querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click',async()=>{const r=await Swal.fire({title:'ยืนยันการกู้คืนทั้งหมด',html:'<div class="info-note">ข้อมูลปัจจุบันในทุกตารางจะถูกแทนที่ด้วยข้อมูลจาก Backup ที่เลือก</div><p>พิมพ์ <strong>RESTORE ALL DATA</strong> เพื่อยืนยัน</p><input id="restoreConfirm" class="swal2-input" placeholder="RESTORE ALL DATA">',icon:'warning',showCancelButton:true,confirmButtonText:'กู้คืนข้อมูล',cancelButtonText:'ยกเลิก',confirmButtonColor:'#b83a45',preConfirm:()=>$('#restoreConfirm').value});if(!r.isConfirmed||r.value!=='RESTORE ALL DATA')return toast('ข้อความยืนยันไม่ถูกต้อง','warning');await busy('กำลังกู้คืนข้อมูล',()=>api('backup.restore',{backupId:b.dataset.restore,confirmation:'RESTORE ALL DATA'}));toast('กู้คืนข้อมูลแล้ว');renderBackups();}));
    }

    /* =====================================================================
       27. SYSTEM STATUS
       ===================================================================== */
    async function renderSystem(){if(!isSuper())throw new Error('เมนูสถานะระบบอนุญาตเฉพาะ Super Admin');const data=await api('system.status',{});const checks=[['ฐานข้อมูลเริ่มต้นแล้ว',data.initialized],['Google Drive Private',data.driveRootConfigured],['ImgBB API',data.imgbbConfigured],['PDF Encryption',data.pdfEncryptionConfigured],['API Gateway',data.gatewayConfigured]];$('#contentArea').innerHTML=`<div class="page-head"><div><div class="eyebrow">SYSTEM HEALTH</div><h1>สถานะระบบ</h1><p>ตรวจสอบการตั้งค่าและจำนวนข้อมูลใน Google Sheets</p></div></div><div class="stats"><div class="card stat"><div class="stat-ico"><i class="fa-solid fa-building"></i></div><div><strong>${data.agencyCount}</strong><span>หน่วยงาน</span></div></div><div class="card stat"><div class="stat-ico"><i class="fa-solid fa-users"></i></div><div><strong>${data.userCount}</strong><span>ผู้ใช้งาน</span></div></div><div class="card stat"><div class="stat-ico"><i class="fa-solid fa-code-branch"></i></div><div><strong>${esc(data.version)}</strong><span>เวอร์ชัน</span></div></div></div><div class="grid-2"><div class="card card-pad"><h3 style="margin-top:0">การเชื่อมต่อบริการ</h3>${checks.map(c=>`<div class="metric-row"><span>${c[0]}</span><span class="badge ${c[1]?'active':'inactive'}">${c[1]?'พร้อมใช้งาน':'ยังไม่ตั้งค่า'}</span></div>`).join('')}<p class="muted small">ตรวจสอบล่าสุด ${dateText(data.timestamp)}</p></div><div class="card card-pad"><h3 style="margin-top:0">จำนวนข้อมูลแยกตามตาราง</h3><div style="max-height:320px;overflow:auto">${Object.entries(data.tableCounts||{}).map(([name,count])=>`<div class="metric-row"><span>${esc(name)}</span><strong>${Number(count).toLocaleString('th-TH')}</strong></div>`).join('')}</div></div></div>`;}

    /* =====================================================================
       28. STARTUP AND GLOBAL EVENT HANDLERS
       ===================================================================== */
    window.addEventListener('DOMContentLoaded',initializeAdmin);
    window.navigate=navigate;window.openAgencyForm=openAgencyForm;window.openUserForm=openUserForm;window.openBookForm=openBookForm;window.printRegistry=printRegistry;window.uploadGeneralFile=uploadGeneralFile;window.uploadMedia=uploadMedia;window.openLookupForm=openLookupForm;
  </script>
</body>
</html>

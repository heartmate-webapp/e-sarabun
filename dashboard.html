  <style>

<body>
<div id="app"><div class="login-wrap"><div class="login-card"><div class="login-logo"><i class="fa-solid fa-circle-notch fa-spin"></i></div><h1>กำลังเตรียมระบบหลังบ้าน</h1><p>ตรวจสอบสิทธิ์ผู้ดูแลระบบ...</p></div></div></div>
<script>
'use strict';
/* =====================================================================
   DOCUMENT REGISTRY SYSTEM - ADMIN CONSOLE
   Shared backend: Code.gs / apiCall(action, payload, sessionToken)
   ===================================================================== */
const ADMIN = { token: '', profile: null, permissions: [], page: 'overview', pageNo: 1, pageSize: 25, rows: [], departments: [], users: [], roles: [], currentDepartmentId: '' };
const TOKEN_KEY = 'DRS_SESSION_TOKEN';
const $ = s => document.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = v => {
    if (!v)
        return '—';
    const d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
    return isNaN(d) ? esc(v) : new Intl.DateTimeFormat('th-TH', { day: '2-digit', month: 'short', year: 'numeric' }).format(d);
};
const fmtDT = v => {
    if (!v)
        return '—';
    const d = new Date(v);
    return isNaN(d) ? esc(v) : new Intl.DateTimeFormat('th-TH', { dateStyle: 'medium', timeStyle: 'short' }).format(d);
};
const num = v => new Intl.NumberFormat('th-TH').format(Number(v || 0));
const isSuper = () => ADMIN.profile?.user?.roleCode === 'SUPER_ADMIN';
const isDeptAdmin = () => ADMIN.profile?.user?.roleCode === 'DEPT_ADMIN';
const isAdmin = () => isSuper() || isDeptAdmin();
const permitted = p => ADMIN.permissions.includes('*') || ADMIN.permissions.includes(p);
const roleLabel = r => ({ SUPER_ADMIN: 'ผู้ดูแลระบบส่วนกลาง', DEPT_ADMIN: 'ผู้ดูแลระบบหน่วยงาน', REGISTRAR: 'เจ้าหน้าที่สารบรรณ', STAFF: 'เจ้าหน้าที่ทั่วไป', DEPT_HEAD: 'หัวหน้าฝ่าย', EXECUTIVE: 'ผู้บริหาร', AUDITOR: 'ผู้ตรวจสอบ' }[r] || r || '—');
const statusText = v => ({ ACTIVE: 'ใช้งาน', INACTIVE: 'ปิดใช้งาน', PENDING: 'รอดำเนินการ', IN_PROGRESS: 'กำลังดำเนินการ', COMPLETED: 'เสร็จสิ้น', DRAFT: 'ฉบับร่าง', PENDING_APPROVAL: 'รออนุมัติ', APPROVED: 'อนุมัติแล้ว', REJECTED: 'ไม่อนุมัติ', DISPATCHED: 'ส่งออกแล้ว', DELIVERED: 'ส่งถึงแล้ว', DELETED: 'ลบแล้ว', ACKNOWLEDGED: 'รับทราบแล้ว' }[v] || v || '—');
const status = v => `<span class="pill ${esc(String(v || '').toLowerCase())}">${esc(statusText(v))}</span>`;
function call(action, payload = {}) {
    return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run)
            return reject(new Error('ต้องเปิดผ่าน Google Apps Script Web App'));
        google.script.run.withSuccessHandler(r => r && r.success ? resolve(r.data) : reject(new Error(r?.error || 'ดำเนินการไม่สำเร็จ'))).withFailureHandler(e => reject(new Error(e?.message || 'เชื่อมต่อไม่สำเร็จ'))).apiCall(action, payload, ADMIN.token);
    });
}
function notify(icon, title) { Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 2500 }); }
function busy(title = 'กำลังดำเนินการ') { Swal.fire({ title, allowOutsideClick: false, didOpen: () => Swal.showLoading() }); }
async function action(actionName, payload, msg) {
    try {
        busy();
        const d = await call(actionName, payload);
        Swal.close();
        if (msg)
            notify('success', msg);
        return d;
    }
    catch (e) {
        Swal.close();
        await Swal.fire({ icon: 'error', title: 'ดำเนินการไม่สำเร็จ', text: e.message });
        throw e;
    }
}
function formInput(key, label, value = '', type = 'text', full = false, required = false) { return `<div class="sf ${full ? 'full' : ''}"><label>${label}</label><input id="f_${key}" type="${type}" value="${esc(value)}" ${required ? 'required' : ''}></div>`; }
function formSelect(key, label, value, opts, full = false) { return `<div class="sf ${full ? 'full' : ''}"><label>${label}</label><select id="f_${key}">${opts.map(o => `<option value="${esc(o[0])}" ${String(value || '') === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`; }
function val(k) { return $(`#f_${k}`)?.value ?? ''; }
function heading(title, desc, buttons = '') { return `<div class="heading"><div><h2>${title}</h2><p>${desc}</p></div><div class="heading-actions">${buttons}</div></div>`; }
function table(columns, rows, actions, empty = 'ไม่พบข้อมูล') {
    if (!rows?.length)
        return `<div class="empty"><i class="fa-regular fa-folder-open"></i><strong>${empty}</strong></div>`;
    return `<table><thead><tr>${columns.map(c => `<th>${c.label}</th>`).join('')}${actions ? '<th>จัดการ</th>' : ''}</tr></thead><tbody>${rows.map(r => `<tr>${columns.map(c => `<td>${c.render ? c.render(r) : esc(r[c.key] || '—')}</td>`).join('')}${actions ? `<td>${actions(r)}</td>` : ''}</tr>`).join('')}</tbody></table>`;
}
function iconAction(icon, act, id, title, red = false) { return `<button class="icon-action ${red ? 'red' : ''}" data-action="${act}" data-id="${esc(id)}" title="${title}"><i class="fa-solid ${icon}"></i></button>`; }
async function paged(actionName, payload, columns, actionFn, empty) {
    const box = $('#tableBody');
    if (box)
        box.innerHTML = '<div class="empty"><i class="fa-solid fa-circle-notch fa-spin"></i><strong>กำลังโหลดข้อมูล</strong></div>';
    try {
        const result = await call(actionName, Object.assign({ page: ADMIN.pageNo, pageSize: ADMIN.pageSize }, payload));
        const items = Array.isArray(result) ? result : (result.items || []);

async function adminDownload(id) {

        const bytes = Uint8Array.from(atob(f.fileBase64), c => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bytes], { type: f.mimeType || 'application/octet-stream' }));

        a.download = f.fileName || 'download';
        document.body.appendChild(a);

                    try {

                    }
                    catch (e) {
                        Swal.showValidationMessage('ไม่สามารถคัดลอกได้');
                    }
                }), willClose: () => { secret = ''; f.passwordForClipboard = ''; } });
        }
        else
            notify('success', 'ดาวน์โหลดไฟล์แล้ว');
    }
    catch (e) {
        Swal.close();
        Swal.fire({ icon: 'error', title: 'ดาวน์โหลดไม่สำเร็จ', text: e.message });
    }

async function trashPage() { const btn = `<button class="btn outline" id="refresh"><i class="fa-solid fa-rotate"></i> โหลดใหม่</button>`; $('#content').innerHTML = tablePage('ถังขยะและกู้คืนข้อมูล', 'กู้คืนรายการที่ลบ หรือสั่งลบถาวรตามสิทธิ์ผู้ดูแล', btn, searchField('ค้นหาตารางหรือรหัสรายการ')); const reload = () => paged('trash.list', { search: $('#queryFilter')?.value || '' }, [{ label: 'วันที่ลบ', render: r => fmtDT(r.DeletedAt) }, { label: 'ตารางต้นทาง', key: 'SourceSheet' }, { label: 'รหัสรายการ', key: 'SourceRecordID' }, { label: 'ผู้ลบ', key: 'DeletedBy' }, { label: 'เหตุผล', key: 'Reason' }], r => `<div class="actions">${iconAction('fa-rotate-left', 'trashRestore', r.TrashID, 'กู้คืน')}${iconAction('fa-trash', 'trashDelete', r.TrashID, 'ลบถาวร', true)}</div>`); $('#refresh').addEventListener('click', reload); $('#queryFilter').addEventListener('input', debounce(reload, 350)); reload(); }
async function restoreTrash(id) {
    const r = await Swal.fire({ icon: 'question', title: 'กู้คืนรายการนี้?', showCancelButton: true, confirmButtonText: 'กู้คืน' });
    if (!r.isConfirmed)
        return;
    await action('trash.restore', { trashId: id }, 'กู้คืนข้อมูลแล้ว');
    loadPage('trash');
}
async function permanentDelete(id) {
    const r = await Swal.fire({ icon: 'warning', title: 'ลบข้อมูลถาวร?', text: 'การดำเนินการนี้ไม่สามารถย้อนกลับได้', showCancelButton: true, confirmButtonText: 'ลบถาวร', confirmButtonColor: '#bd4141' });
    if (!r.isConfirmed)
        return;
    await action('trash.permanentDelete', { trashId: id, confirm: true }, 'ลบข้อมูลถาวรแล้ว');

}
async function backupsPage() {
    const btn = `<button class="btn primary" id="createBackup"><i class="fa-solid fa-database"></i> สำรองข้อมูลตอนนี้</button>`;
    $('#content').innerHTML = tablePage('สำรองและกู้คืนฐานข้อมูล', 'สำรอง Google Sheets ไปยัง Google Drive ส่วนตัว (ไม่รวมไฟล์แนบต้นฉบับ)', btn, searchField('ค้นหาชื่อไฟล์สำรอง'));
    const reload = () => paged('system.backups.list', { search: $('#queryFilter')?.value || '' }, [{ label: 'ชื่อข้อมูลสำรอง', key: 'BackupName' }, { label: 'วันที่', render: r => fmtDT(r.CreatedAt) }, { label: 'ขนาด', render: r => num(r.FileSizeBytes) + ' bytes' }, { label: 'สถานะ', render: r => status(r.Status) }, { label: 'หมายเหตุ', key: 'Notes' }], r => iconAction('fa-rotate', 'backupRestore', r.BackupID, 'กู้คืน'));
    $('#createBackup').addEventListener('click', async () => {
        const r = await Swal.fire({ title: 'สำรองฐานข้อมูล', input: 'text', inputLabel: 'หมายเหตุ (ถ้ามี)', showCancelButton: true, confirmButtonText: 'เริ่มสำรอง' });
        if (!r.isConfirmed)
            return;
        await action('system.backups.create', { notes: r.value || '' }, 'สำรองฐานข้อมูลแล้ว');
        loadPage('backups');
    });
    $('#queryFilter').addEventListener('input', debounce(reload, 350));
    reload();
}
async function restoreBackup(id) {
    const r = await Swal.fire({ icon: 'warning', title: 'กู้คืนฐานข้อมูล?', text: 'ระบบจะสร้างข้อมูลสำรองฉุกเฉินของฐานข้อมูลปัจจุบันก่อนกู้คืน', showCancelButton: true, confirmButtonText: 'ยืนยันกู้คืน', confirmButtonColor: '#b74a4a' });
    if (!r.isConfirmed)
        return;

}
async function healthPage() {
    const btn = `<button class="btn accent" id="maintenance"><i class="fa-solid fa-screwdriver-wrench"></i> บำรุงรักษาระบบ</button><button class="btn outline" id="refreshHealth"><i class="fa-solid fa-rotate"></i> ตรวจสอบอีกครั้ง</button>`;
    $('#content').innerHTML = heading('สถานะระบบและบำรุงรักษา', 'ตรวจสอบการเชื่อมต่อบริการหลักและดำเนินการบำรุงรักษา', btn) + `<div class="grid-two"><section class="panel"><div class="panel-head"><h3>สุขภาพบริการ</h3></div><div class="panel-body" id="healthDetails">กำลังตรวจสอบ...</div></section><section class="panel"><div class="panel-head"><h3>การตั้งค่าการเชื่อมต่อ</h3></div><div class="panel-body"><div class="kv"><span>ฐานข้อมูล</span><b>Google Sheets</b></div><div class="kv"><span>ที่เก็บไฟล์</span><b>Google Drive ส่วนตัว</b></div><div class="kv"><span>บริการรูปภาพ</span><b>ImgBB API</b></div><div class="kv"><span>PDF</span><b>Canvas-based PDF</b></div><div class="kv"><span>รหัสผ่านไฟล์</span><b>Encryption Service</b></div><p class="sub" style="margin-top:12px">API Key และ Token ต้องเก็บใน Script Properties เท่านั้น</p></div></section></div>`;
    const refresh = async () => { const h = await call('system.health'); $('#healthDetails').innerHTML = [['ฐานข้อมูล Google Sheets', h.database], ['Google Drive ส่วนตัว', h.drive], ['ImgBB API', h.imgbbConfigured], ['บริการเข้ารหัสไฟล์', h.encryptionConfigured], ['เวอร์ชัน Schema', h.schemaVersion], ['ตรวจสอบล่าสุด', fmtDT(h.checkedAt)]].map(x => `<div class="status-line">${typeof x[1] === 'boolean' ? `<span class="led ${x[1] ? '' : 'bad'}"></span>` : '<i class="fa-solid fa-circle-info" style="color:#6b8aa2"></i>'}<div style="flex:1">${x[0]}</div><b>${typeof x[1] === 'boolean' ? (x[1] ? 'พร้อมใช้งาน' : 'ยังไม่พร้อม') : esc(x[1])}</b></div>`).join(''); };
    await refresh();
    $('#refreshHealth').addEventListener('click', refresh);
    $('#maintenance').addEventListener('click', async () => {
        const r = await Swal.fire({ icon: 'warning', title: 'บำรุงรักษาระบบ?', text: 'จะล้าง Login Attempts และคำขอรีเซ็ตที่เก่า รวมถึงหมดอายุเซสชันและรหัสผ่านดาวน์โหลด', showCancelButton: true, confirmButtonText: 'ดำเนินการ' });
        if (!r.isConfirmed)
            return;
        const x = await action('system.maintenance', {}, 'บำรุงรักษาระบบเรียบร้อย');
        await Swal.fire({ icon: 'success', title: 'ผลการบำรุงรักษา', html: `<div style="text-align:left">${Object.entries(x).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${num(v)}</b></div>`).join('')}</div>` });
    });
}
/* Admin-specific click delegation */
document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (!b)
        return;
    const a = b.dataset.action, id = b.dataset.id;
    if (a === 'adminFilesReceive')
        adminFiles(id, 'RECEIVE');
    if (a === 'adminFilesSend')
        adminFiles(id, 'SEND');
    if (a === 'adminDocFiles')
        adminFiles(id, 'DOCUMENT');
    if (a === 'adminTrashReceive')
        adminTrash(id, 'RECEIVE');
    if (a === 'adminTrashSend')
        adminTrash(id, 'SEND');
    if (a === 'adminDocTrash')
        adminTrash(id, 'DOCUMENT');
    if (a === 'adminRecordEdit') {
        const type = ADMIN.page === 'receive' ? 'receive' : 'send';
        const row = ADMIN.rows.find(item => item.RecordID === id);
        adminRecordForm(type, row);
    }
    if (a === 'adminDocumentEdit') {
        const row = ADMIN.rows.find(item => item.DocumentID === id);
        adminDocumentForm(row);
    }
    if (a === 'workflowAcknowledge')
        adminWorkflowDecision(id, 'acknowledge');
    if (a === 'workflowApprove')
        adminWorkflowDecision(id, 'approve');
    if (a === 'workflowReject')
        adminWorkflowDecision(id, 'reject');
    if (a === 'assignmentComplete')
        completeAssignment(id);
});
async function completeAssignment(assignmentId) {
    const result = await Swal.fire({ icon: 'question', title: 'ปิดงานนี้?', showCancelButton: true, confirmButtonText: 'ปิดงาน', cancelButtonText: 'ยกเลิก' });
    if (!result.isConfirmed)
        return;
    await action('assignments.complete', { assignmentId }, 'ปิดงานเรียบร้อย');
    loadPage('assignments');
}
async function adminTrash(id, type) {
    const r = await Swal.fire({ icon: 'warning', title: 'ย้ายรายการไปถังขยะ?', showCancelButton: true, confirmButtonText: 'ยืนยัน' });
    if (!r.isConfirmed)
        return;
    const route = type === 'RECEIVE' ? 'register.receive.delete' : type === 'SEND' ? 'register.send.delete' : 'documents.delete';
    const payload = type === 'DOCUMENT' ? { documentId: id, reason: 'ลบจากระบบหลังบ้าน' } : { recordId: id, reason: 'ลบจากระบบหลังบ้าน' };
    await action(route, payload, 'ย้ายไปถังขยะแล้ว');
    loadPage(type === 'RECEIVE' ? 'receive' : type === 'SEND' ? 'send' : 'documents');
}
document.addEventListener('DOMContentLoaded', start);
